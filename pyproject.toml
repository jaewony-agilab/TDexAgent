[project]
name = "tdex"
version = "0.1.0"
description = "Contact-annotated agentic manipulation: RLDX-1 executor + VLM judge + LLM planner on GR-1 Tabletop"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Judge / planner clients. Installed into the sim venv on the cluster.
llm = [
    "anthropic>=0.70",
    "openai>=1.40",  # only for the vLLM-served open VLM (OpenAI-compatible endpoint)
]
dev = ["pytest>=8.0", "mujoco>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tdex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
